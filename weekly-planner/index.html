<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c7a86">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>html{color-scheme:light}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>Flexible Weekly Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: sticky week bar, a 7-day strip that doubles as the week overview, and one open day beneath it. */
:root {
  --bg: #f3f6f7;
  --surface: #ffffff;
  --ink: #12222b;
  --muted: #5c6f79;
  --line: #d9e1e5;
  --accent: #0c7a86;
  --accent-soft: #dff1f3;
  --accent-ink: #ffffff;
  --today: #c2410c;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1a20; --surface: #17262e; --ink: #e6eef2; --muted: #93a7b1; --line: #2a3d47;
    --accent: #4cc3cf; --accent-soft: #1b3a42; --accent-ink: #0b1a1f; --today: #fb923c; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1a20; --surface: #17262e; --ink: #e6eef2; --muted: #93a7b1; --line: #2a3d47;
  --accent: #4cc3cf; --accent-soft: #1b3a42; --accent-ink: #0b1a1f; --today: #fb923c; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 400 15px/1.45 var(--font-body); padding-inline: 16px; padding-block: 0 48px; }
.wrap { max-width: 1000px; margin-inline: auto; }
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* week bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 16px 12px; display: flex; flex-wrap: wrap; align-items: end; gap: 12px 20px; justify-content: space-between; border-bottom: 1px solid var(--line); }
h1 { font: 800 clamp(26px, 5vw, 38px)/1.05 var(--font-display); margin: 0; letter-spacing: -0.02em; }
.weekpick { display: flex; align-items: center; gap: 8px; }
.weekpick label { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
.weekpick input[type=date] { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; }
.iconbtn { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; width: 36px; height: 36px; cursor: pointer; font-size: 18px; line-height: 1; }
.iconbtn:hover { border-color: var(--accent); }
.textbtn { background: none; border: 0; color: var(--accent); font-weight: 600; cursor: pointer; padding: 6px 4px; }

/* day strip */
.strip { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; margin-block: 20px; }
.tab { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px; cursor: pointer; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.tab:hover { border-color: var(--accent); }
.tab[aria-selected="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
.tab .dn { font: 600 12px var(--font-body); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.tab.today .dn { color: var(--today); }
.tab .dd { font: 800 22px/1 var(--font-display); font-variant-numeric: tabular-nums; }
.tab .th { font-size: 12px; color: var(--muted); min-height: 1.4em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.meter { height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; margin-top: 4px; }
.meter i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }

/* open day */
.day { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: clamp(16px, 3vw, 28px); display: grid; gap: 24px; }
.dayhead { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 12px; }
.dayhead h2 { margin: 0; font: 800 clamp(28px, 6vw, 44px)/1 var(--font-display); letter-spacing: -0.02em; }
.dayhead small { display: block; color: var(--muted); margin-top: 4px; font-variant-numeric: tabular-nums; }
.count { font-variant-numeric: tabular-nums; color: var(--muted); font-weight: 600; }
.field { display: grid; gap: 6px; }
.lab { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
.line { width: 100%; background: transparent; border: 0; border-bottom: 1.5px solid var(--line); padding: 8px 2px; border-radius: 0; }
.line:focus { outline: none; border-bottom-color: var(--accent); }
.line::placeholder, textarea::placeholder { color: var(--muted); opacity: .65; }
.pri { display: grid; gap: 4px; }
.row { display: grid; grid-template-columns: 28px 22px minmax(0, 1fr); align-items: center; gap: 8px; }
.row .n { font: 800 18px var(--font-display); color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
.row input[type=checkbox] { appearance: none; width: 22px; height: 22px; border: 2px solid var(--muted); border-radius: 6px; margin: 0; cursor: pointer; display: grid; place-content: center; background: transparent; }
.row input[type=checkbox]:checked { background: var(--accent); border-color: var(--accent); }
.row input[type=checkbox]:checked::after { content: ""; width: 5px; height: 10px; border: solid var(--accent-ink); border-width: 0 2.5px 2.5px 0; transform: translateY(-1px) rotate(45deg); }
.row.done .line { text-decoration: line-through; color: var(--muted); }
.blocks { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.block { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: grid; gap: 6px; align-content: start; }
.block textarea { width: 100%; min-height: 120px; resize: vertical; background: transparent; border: 0; padding: 0; line-height: 1.5; }
.block textarea:focus { outline: none; }
.block:focus-within { border-color: var(--accent); }
.block .when { font-size: 12px; color: var(--muted); }
.acts { display: flex; flex-wrap: wrap; gap: 4px 12px; }
a.textbtn { text-decoration: none; }
.foot { display: flex; flex-wrap: wrap; gap: 8px 16px; justify-content: space-between; align-items: center; margin-top: 16px; color: var(--muted); font-size: 13px; }

@media (max-width: 720px) {
  .strip { grid-template-columns: repeat(7, 64px); overflow-x: auto; padding-bottom: 6px; }
  .tab .th { display: none; }
  .blocks { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) { .meter i { transition: none; } }
</style>

</head>
<body>
<div class="wrap">
  <header class="bar">
    <h1>Flexible Weekly Planner</h1>
    <div class="weekpick">
      <button class="iconbtn" id="prev" aria-label="Previous week">‹</button>
      <label for="weekof">Week of</label>
      <input type="date" id="weekof">
      <button class="iconbtn" id="next" aria-label="Next week">›</button>
      <button class="textbtn" id="thisweek">This week</button>
    </div>
  </header>

  <nav class="strip" id="strip" role="tablist" aria-label="Days of the week"></nav>

  <main class="day" id="day"></main>

  <div class="foot">
    <span id="weeksum"></span>
    <span class="acts">
      <button class="textbtn" id="export">Export data</button>
      <button class="textbtn" id="import">Import data</button>
      <input type="file" id="importfile" accept="application/json" hidden>
      <a class="textbtn" id="feedback" href="#" hidden>Send feedback</a>
      <button class="textbtn" id="clear">Clear this week</button>
    </span>
  </div>
</div>

<script>
const DAYS = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
const BLOCKS = [["am","Morning","Before noon"],["mid","Midday","Noon to late afternoon"],["pm","Evening","After work"]];
const KEY = "flexible-weekly-planner-v1";
let store = { weeks: {} };
try { store = JSON.parse(localStorage.getItem(KEY)) || store; } catch (e) {}
let saveT;
const save = () => { clearTimeout(saveT); saveT = setTimeout(() => { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} }, 200); };

const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const monday = d => { const x = new Date(d); x.setDate(x.getDate() - ((x.getDay()+6) % 7)); return x; };
const fmt = (d, o) => d.toLocaleDateString(undefined, o);

const todayD = new Date(); const todayIso = iso(todayD);
let weekStart = monday(todayD);
let sel = (todayD.getDay()+6) % 7;

const blankDay = () => ({ theme: "", pri: [0,1,2,3].map(() => ({ t: "", d: false })), am: "", mid: "", pm: "" });
function week() {
  const k = iso(weekStart);
  if (!store.weeks[k]) store.weeks[k] = { days: DAYS.map(blankDay) };
  return store.weeks[k];
}
const $ = id => document.getElementById(id);
const prog = d => { const f = d.pri.filter(p => p.t.trim()); return { done: f.filter(p => p.d).length, total: f.length }; };

function renderStrip() {
  const w = week();
  $("strip").innerHTML = "";
  DAYS.forEach((name, i) => {
    const date = addDays(weekStart, i), d = w.days[i], p = prog(d);
    const b = document.createElement("button");
    b.className = "tab" + (iso(date) === todayIso ? " today" : "");
    b.setAttribute("role", "tab"); b.setAttribute("aria-selected", i === sel);
    b.innerHTML = `<span class="dn">${name.slice(0,3)}</span><span class="dd">${date.getDate()}</span><span class="th"></span><span class="meter"><i style="width:${p.total ? p.done/p.total*100 : 0}%"></i></span>`;
    b.querySelector(".th").textContent = d.theme || "No theme";
    b.onclick = () => { sel = i; render(); };
    $("strip").appendChild(b);
  });
  let done = 0, total = 0;
  w.days.forEach(d => { const p = prog(d); done += p.done; total += p.total; });
  $("weeksum").textContent = total ? `${done} of ${total} priorities done this week` : "No priorities added this week yet";
}

function renderDay() {
  const w = week(), d = w.days[sel], date = addDays(weekStart, sel);
  const el = $("day"); el.innerHTML = "";
  const head = document.createElement("div"); head.className = "dayhead";
  head.innerHTML = `<div><h2>${DAYS[sel]}</h2><small>${fmt(date, {month:"long", day:"numeric", year:"numeric"})}${iso(date) === todayIso ? " · Today" : ""}</small></div><span class="count" id="count"></span>`;
  el.appendChild(head);

  const theme = document.createElement("div"); theme.className = "field";
  theme.innerHTML = `<label class="lab" for="theme">Theme</label><input class="line" id="theme" placeholder="What is this day about?" maxlength="80">`;
  const ti = theme.querySelector("input"); ti.value = d.theme;
  ti.oninput = () => { d.theme = ti.value; save(); renderStrip(); };
  el.appendChild(theme);

  const pri = document.createElement("div"); pri.className = "pri";
  pri.innerHTML = `<span class="lab">Must-move priorities</span>`;
  d.pri.forEach((p, i) => {
    const r = document.createElement("div"); r.className = "row" + (p.d ? " done" : "");
    r.innerHTML = `<span class="n">${i+1}</span><input type="checkbox" id="c${i}" aria-label="Priority ${i+1} done"><input class="line" id="p${i}" placeholder="Priority ${i+1}" maxlength="140">`;
    const cb = r.querySelector("[type=checkbox]"), tx = r.querySelector(".line");
    cb.checked = p.d; tx.value = p.t;
    cb.onchange = () => { p.d = cb.checked; r.classList.toggle("done", p.d); save(); renderStrip(); count(); };
    tx.oninput = () => { p.t = tx.value; save(); renderStrip(); count(); };
    pri.appendChild(r);
  });
  el.appendChild(pri);

  const blocks = document.createElement("div"); blocks.className = "blocks";
  BLOCKS.forEach(([k, label, when]) => {
    const b = document.createElement("div"); b.className = "block";
    b.innerHTML = `<label class="lab" for="b-${k}">${label}</label><span class="when">${when}</span><textarea id="b-${k}" placeholder="Plan ${label.toLowerCase()}…"></textarea>`;
    const ta = b.querySelector("textarea"); ta.value = d[k];
    ta.oninput = () => { d[k] = ta.value; save(); };
    blocks.appendChild(b);
  });
  el.appendChild(blocks);
  count();
  function count() { const p = prog(d); $("count").textContent = p.total ? `${p.done} of ${p.total} priorities done` : ""; }
}

function render() { $("weekof").value = iso(weekStart); renderStrip(); renderDay(); }
const shift = n => { weekStart = addDays(weekStart, n); sel = Math.min(sel, 6); render(); };
$("prev").onclick = () => shift(-7);
$("next").onclick = () => shift(7);
$("thisweek").onclick = () => { weekStart = monday(todayD); sel = (todayD.getDay()+6) % 7; render(); };
$("weekof").onchange = e => { if (e.target.value) { weekStart = monday(parse(e.target.value)); render(); } };
let armed = false;
$("clear").onclick = e => {
  if (!armed) { armed = true; e.target.textContent = "Click again to confirm"; setTimeout(() => { armed = false; e.target.textContent = "Clear this week"; }, 3000); return; }
  armed = false; e.target.textContent = "Clear this week";
  store.weeks[iso(weekStart)] = { days: DAYS.map(blankDay) }; save(); render();
};
render();

// Backup and restore
$("export").onclick = () => {
  const blob = new Blob([JSON.stringify(store, null, 2)], { type: "application/json" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
  a.download = `weekly-planner-${iso(new Date())}.json`; a.click(); URL.revokeObjectURL(a.href);
};
$("import").onclick = () => $("importfile").click();
$("importfile").onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    if (!data || typeof data.weeks !== "object") throw 0;
    store = data; save(); render(); $("weeksum").textContent = "Data imported";
  } catch (err) { $("weeksum").textContent = "That file is not a planner backup"; }
  e.target.value = "";
};

// Feedback: put your email here before publishing. Leave empty to hide the link.
const FEEDBACK_EMAIL = "";
if (FEEDBACK_EMAIL) { const a = $("feedback"); a.hidden = false; a.href = "mailto:" + FEEDBACK_EMAIL + "?subject=" + encodeURIComponent("Weekly planner feedback"); }

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
